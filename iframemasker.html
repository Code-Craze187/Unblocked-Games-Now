<!DOCTYPE html>
<html>
<head>
  <title> iFrame </title>
  <script language="javascript"> 
   function LoadPage(){ 
     var objFrame=document.getElementById("myIframe"); 
     objFrame.src=document.getElementById("URL").value;
    }
  </script>
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "pqewt0av58");
</script>
</head>
<body>
<P>Warning: Some webisites dont like iframes peeking at their webisites, so it will refuse to connect. Other webisites will work fine.</P>
<div style="Clear:both;"> 
 <input type="text" value="http://example.com" class="frmUrlVal" ID="URL">
 <input type="submit" class="frmSubmit" value="Go" onclick="LoadPage()">
 <input type="button" VALUE="&lt; &lt; &nbsp; Back &nbsp;"  onClick="myIframe.history.back()"> 
 <input type="button" VALUE="Forward &nbsp; &gt; &gt;"  onClick="myIframe.history.forward()"> 
</div>
<iframe align="center" width="1200" height="500" src="http://example.com" frameborder=yes scrolling="yes" name="myIframe" id="myIframe"> </iframe>
</body>
</html>
